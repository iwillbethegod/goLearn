version: "2"
sql:
  - engine: postgresql
    queries: db/queries
    schema:  db/migrations
    gen:
      go:
        package: pgdb
        out:     internal/storage/postgres/pgdb
        sql_package: pgx/v5
        emit_json_tags: false
        emit_pointers_for_null_types: true
        emit_methods_with_db_argument: false
