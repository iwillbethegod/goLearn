name: Release images

# On every push to main: build cmd/api and cmd/consumer images and
# push to GHCR with two tags — `latest` and the commit SHA. Multi-arch
# (linux/amd64 only for now; arm64 deferred — emulator builds are
# 10x slower without a native arm64 runner).

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write   # required to push to ghcr.io

jobs:
  publish:
    name: build + push (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [api, consumer]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: lowercase repo owner
        # GHCR refuses uppercase image names. github.repository_owner
        # may contain caps (e.g. iwillbethegod is fine, but defensive).
        id: lc
        run: echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: build & push ${{ matrix.target }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.${{ matrix.target }}
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/${{ steps.lc.outputs.owner }}/golearn-${{ matrix.target }}:latest
            ghcr.io/${{ steps.lc.outputs.owner }}/golearn-${{ matrix.target }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
