name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: vet + test + coverage gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: go vet
        run: go vet ./...

      - name: install gocovmerge
        # Merges multiple coverprofile outputs without double-counting
        # — concatenation alone would sum hit counts on duplicate
        # file:line entries and skew the gate.
        run: go install github.com/wadey/gocovmerge@latest

      - name: unit tests + coverage profile
        run: |
          go test -race -short -timeout=5m \
              -coverprofile=cover.unit.out \
              -coverpkg=./internal/...,./pkg/...,./cmd/api/... \
              ./...

      - name: integration tests (testcontainers) + coverage
        # Docker is preinstalled on ubuntu-latest. Build tag
        # `integration` keeps these out of the unit run, AND we feed
        # them into the same -coverpkg so the postgres + nats code
        # paths exercised here count toward the gate.
        run: |
          go test -tags=integration -race -timeout=10m \
              -coverprofile=cover.int.out \
              -coverpkg=./internal/...,./pkg/...,./cmd/api/... \
              ./internal/integration/...

      - name: merge coverage profiles
        run: gocovmerge cover.unit.out cover.int.out > cover.out

      - name: coverage gate (>= 70%, generated code excluded)
        env:
          COVER_FILE: cover.out
        run: ./scripts/cover-gate.sh 70

      - name: upload coverage profile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cover-profile
          path: cover.out
          retention-days: 14

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: false  # the lint action has its own cache

      - uses: golangci/golangci-lint-action@v6
        with:
          version: v1.62.0
          args: --timeout=5m
