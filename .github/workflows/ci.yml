name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: vet + test + coverage gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: go vet
        run: go vet ./...

      - name: unit tests + coverage profile
        run: |
          go test -race -short -timeout=5m \
              -coverprofile=cover.out \
              -coverpkg=./internal/...,./pkg/...,./cmd/api/... \
              ./...

      - name: integration tests (testcontainers)
        # Docker is preinstalled on ubuntu-latest. The build tag
        # `integration` keeps these out of the unit run.
        run: go test -tags=integration -race -timeout=10m ./internal/integration/...

      - name: coverage gate (>= 70%, generated code excluded)
        env:
          COVER_FILE: cover.out
        run: ./scripts/cover-gate.sh 70

      - name: upload coverage profile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cover-profile
          path: cover.out
          retention-days: 14

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: false  # the lint action has its own cache

      - uses: golangci/golangci-lint-action@v6
        with:
          version: v1.62.0
          args: --timeout=5m
